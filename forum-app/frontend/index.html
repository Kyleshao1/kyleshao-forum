<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kyleshao-forum</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
    <script>
      window.__API_BASE__ = "/.netlify/functions/api";
    </script>
    <style>
      :root {
        --bg: #f7f2eb;
        --ink: #1f1f1f;
        --muted: #6b6b6b;
        --accent: #0f766e;
        --accent-2: #f59e0b;
        --card: #ffffff;
        --line: #e7e2da;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 800px at 10% 0%, #ffe8cc, transparent),
                    radial-gradient(1200px 800px at 100% 10%, #dff7f5, transparent),
                    var(--bg);
      }
      header {
        position: sticky;
        top: 0;
        background: rgba(247, 242, 235, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        z-index: 10;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .brand { font-weight: 700; letter-spacing: 0.5px; }
      .pill {
        border: 1px solid var(--line);
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--card);
      }
      .grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.04);
      }
      .btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn.secondary { background: #374151; }
      .btn.ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      input, textarea, select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: inherit;
      }
      textarea { min-height: 120px; }
      .list { display: grid; gap: 12px; }
      .title { font-size: 20px; font-weight: 700; }
      .muted { color: var(--muted); }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        color: white;
        display: inline-block;
      }
      .markdown { line-height: 1.7; }
      .markdown code { background: #f1f1f1; padding: 2px 6px; border-radius: 6px; }
      .markdown .mention {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        background: rgba(15,118,110,0.12);
        padding: 0 4px;
        border-radius: 6px;
      }
      .markdown .mention:hover {
        text-decoration: underline;
      }
      mark {
        background: #fde68a;
        color: inherit;
        padding: 0 2px;
        border-radius: 4px;
      }
      .nav a { margin-right: 10px; color: var(--ink); text-decoration: none; }
      .nav a.active { color: var(--accent); font-weight: 700; }
      .split { display: flex; gap: 10px; align-items: center; }
      .mini { font-size: 12px; }
      .post-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .right { text-align: right; }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap row">
        <div class="brand">kyleshao-forum</div>
        <nav class="nav">
          <a href="#/">首页</a>
          <a href="#/new">发帖</a>
          <a href="#/me">个人</a>
          <a href="#/messages">私信</a>
          <a href="#/tickets">工单</a>
          <a href="#/ostracism">陶片放逐</a>
          <a href="#/admin">管理</a>
          <a href="https://github.com/Kyleshao1/kyleshao-forum" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
        <div class="row" style="margin-left:auto;">
          <span id="user-pill" class="pill mini">未登录</span>
          <button id="logout" class="btn ghost">退出</button>
        </div>
      </div>
    </header>
    <div id="root" class="wrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
